# The surface bundle (surface.Dockerfile). The reader fetches the manifest and the files it lists from another origin, so every
# response allows any origin (the files are public; the reader checks each file's sha384 against the manifest). The manifest is
# re-read on every page load; the hashed files never change. (nginx drops server-level add_header in a location that sets its
# own, so each location repeats them.)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /manifest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
