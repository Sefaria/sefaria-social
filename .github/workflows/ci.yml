# CI (plan section 5.8). The only required check is `result`; it aggregates every other job.
# Jobs today: changes → static (typecheck, lint, format, architecture + factory tests, doctor, atlas) → unit, build,
# integration (L2: the API against real Postgres, migrations, OpenAPI breaking check, built-server smoke test),
# contract (L3) and e2e-harness (L4a); spec-gate (no spec, no code) and prove-red (acceptance tests are red on the merge
# base) → result. Every job must be added to `result`'s `needs` (doctor checks this).
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests: a new push cancels the superseded run. main and the merge queue: every run completes.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  CI: "true"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Decide whether code changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Docs-only changes (Markdown anywhere, and docs/**) skip unit and build. Anything else, or any doubt, runs everything.
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            merge_group) BASE="$MQ_BASE" ;;
            *) BASE="$PUSH_BEFORE" ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base ($BASE); running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"; echo "$CHANGED"
          CODE=$(echo "$CHANGED" | grep -Ev '(^docs/|\.md$)' | grep -c . || true)
          if [ "$CODE" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          echo "code files changed: $CODE"

  static:
    name: static
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the atlas PR checks and the factory's fixture repos need history
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (warnings fail)
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Architecture tests
        run: npx vitest run --project architecture --reporter=default --reporter=junit --outputFile.junit=test-results/architecture.xml
      - name: Factory tests (every gate, hook and doctor rule with its negative test)
        run: npx vitest run --project factory --reporter=default --reporter=junit --outputFile.junit=test-results/factory.xml
      - name: Factory doctor
        # --skip-tests: the guard negative tests just ran in the step above; the nightly runs doctor in full.
        run: npm run factory -- doctor --skip-tests
      - name: Feature atlas
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            merge_group) BASE="$MQ_BASE" ;;
            *) BASE="" ;;
          esac
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npm run factory -- atlas --base "$BASE"
          else
            echo "No PR base (event: $EVENT); checking the atlas without the PR-level checks."
            npm run factory -- atlas
          fi

  unit:
    name: unit
    needs: [changes, static]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run --project unit --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml

  build:
    name: build
    needs: [changes, static]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start build
        run: npm run build
      - name: Generated route tree is committed
        run: |
          # The router plugin regenerates app/src/routeTree.gen.ts during the build; a difference means it was not committed.
          git diff --exit-code -- app/src/routeTree.gen.ts || {
            echo "::error file=app/src/routeTree.gen.ts::The generated route tree is out of date. Fix: run 'npm run build' and commit app/src/routeTree.gen.ts."
            exit 1
          }
      - name: Surface build
        run: npm run build:surface
      - name: Surface build output
        run: |
          # The reader loads app/dist-surface/manifest.json; print it so the PR shows what a release would contain.
          cat app/dist-surface/manifest.json

  contract:
    name: contract
    # L3 (plan 5.5): the surface mounted into the fake host, the surface build's manifest, the pinned contract's hash check.
    needs: [changes, static]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Contract tests
        run: npx vitest run --project contract --reporter=default --reporter=junit --outputFile.junit=test-results/contract.xml
      - name: Pinned contract matches its recorded hashes
        run: npm run check -w @sefaria-social/host-contract

  e2e-harness:
    name: e2e-harness
    # L4a (plan 5.5): Playwright on the harness, desktop and phone viewports, English and Hebrew.
    needs: [changes, static]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Harness journeys
        run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-harness-traces
          path: test-results/
          retention-days: 7

  integration:
    name: integration
    # L2 (plan 5.5): the API against real Postgres (a service container), tokens signed by a key generated at test time and
    # served from a local JWKS, the walk-the-schema deletion test, then three checks that need the same tree: migrations
    # match the schema, the OpenAPI document has no breaking change against the base, and the built Start server serves the API.
    needs: [changes, static]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: social
          POSTGRES_PASSWORD: social
          POSTGRES_DB: sefaria_social_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U social -d sefaria_social_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://social:social@localhost:5432/sefaria_social_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the OpenAPI check reads the base's document from history
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Integration tests (real Postgres)
        run: npx vitest run --project integration --reporter=default --reporter=junit --outputFile.junit=test-results/integration.xml
      - name: Relay tests (the Worker in workerd through Miniflare)
        run: npx vitest run --project relay --reporter=default --reporter=junit --outputFile.junit=test-results/relay.xml
      - name: Migrations match the schema
        run: |
          npm run db:generate -- --name drift-check < /dev/null
          if [ -n "$(git status --porcelain -- app/src/server/db/migrations)" ]; then
            git status --porcelain -- app/src/server/db/migrations
            echo "::error file=app/src/server/db/schema.ts::The schema has changes with no migration. Fix: run 'npm run db:generate -- --name <what-changed>' and commit the new file in app/src/server/db/migrations."
            exit 1
          fi
      - name: OpenAPI breaking-change check
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            merge_group) BASE="$MQ_BASE" ;;
            *) BASE="$PUSH_BEFORE" ;;
          esac
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npm run api:breaking -- --base "$BASE"
          else
            echo "No usable base ($EVENT); nothing to compare the OpenAPI document with."
          fi
      - name: Build and smoke-test the Start server
        env:
          DATABASE_URL: postgres://social:social@localhost:5432/sefaria_social_test
          USER_DELETED_WEBHOOK_SECRET: ci-smoke-only
          LOG_LEVEL: error
        run: npm run build && npm run smoke:server

  spec-gate:
    name: spec-gate
    # No spec, no code (plan 5.4). Runs on every PR and merge-queue run, docs-only included (it decides the lane itself).
    # On a push to main it is skipped on purpose: the change already passed the gate in the merge queue.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # trailers and the merge base come from history
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Spec gate
        env:
          FACTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: npm run factory -- gate --base "$FACTORY_BASE"

  prove-red:
    name: prove-red
    # Red before green (plan 5.5 rule 2): new or changed @ac tests must fail on the merge base, on an assertion.
    needs: [changes, static]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # New integration acceptance tests load on the merge base's integration project, whose global setup needs Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: social
          POSTGRES_PASSWORD: social
          POSTGRES_DB: sefaria_social_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U social -d sefaria_social_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://social:social@localhost:5432/sefaria_social_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prove red
        env:
          FACTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: npm run factory -- prove-red --base "$FACTORY_BASE"

  result:
    name: result
    needs: [changes, static, unit, build, integration, contract, e2e-harness, spec-gate, prove-red]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          INTEGRATION: ${{ needs.integration.result }}
          CONTRACT: ${{ needs.contract.result }}
          E2E_HARNESS: ${{ needs.e2e-harness.result }}
          SPEC_GATE: ${{ needs.spec-gate.result }}
          PROVE_RED: ${{ needs.prove-red.result }}
          EVENT: ${{ github.event_name }}
        run: |
          # Policy:
          # - changes and static must succeed on every run. Skipped or cancelled counts as failure.
          # - unit, build, integration, contract and e2e-harness must succeed, except that `skipped` is accepted when the changes filter decided on purpose that
          #   only docs changed (CODE == false). A skip for any other reason (for example a failed dependency) is a failure.
          # - spec-gate must succeed on pull_request and merge_group. `skipped` is accepted only on a push to main, where its
          #   `if` skips it on purpose (the change passed the gate in the merge queue).
          # - prove-red must succeed, except `skipped` on a push to main (skipped on purpose) or when the changes filter
          #   decided only docs changed (CODE == false). A skip for any other reason is a failure.
          # - cancelled is always a failure (a superseded PR run is cancelled as a whole, so this result is never the last word).
          fail=0
          must_succeed() { if [ "$2" != "success" ]; then echo "::error::$1 is '$2' (must be success)"; fail=1; else echo "$1: success"; fi; }
          filterable() {
            if [ "$2" = "success" ]; then echo "$1: success"
            elif [ "$2" = "skipped" ] && [ "$CODE" = "false" ]; then echo "$1: skipped by the changes filter (docs only)"
            else echo "::error::$1 is '$2' (changes.code=$CODE)"; fail=1; fi
          }
          must_succeed changes "$CHANGES"
          must_succeed static "$STATIC"
          filterable unit "$UNIT"
          filterable build "$BUILD"
          filterable integration "$INTEGRATION"
          filterable contract "$CONTRACT"
          filterable e2e-harness "$E2E_HARNESS"
          if [ "$SPEC_GATE" = "skipped" ] && [ "$EVENT" = "push" ]; then echo "spec-gate: skipped on push to main (on purpose)"
          else must_succeed spec-gate "$SPEC_GATE"; fi
          if [ "$PROVE_RED" = "skipped" ] && [ "$EVENT" = "push" ]; then echo "prove-red: skipped on push to main (on purpose)"
          else filterable prove-red "$PROVE_RED"; fi
          exit $fail
